name: 更新彩票数据

on:
  schedule:
    # 每天22:00北京时间（UTC 14:00）运行
    - cron: '0 14 * * 1,3,5,6'
    # 双色球：二四日开奖 → 周二三四六22:00更新
    # 大乐透：一三六开奖 → 周一三四六22:00更新
    # 合并取并集：周一三五六
  workflow_dispatch: # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行数据更新脚本
        run: python scripts/update_data.py

      - name: 检查是否有变更
        id: check
        run: |
          git diff --quiet data/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: 提交并推送
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "lottery-bot"
          git config user.email "bot@lottery.local"
          git add data/
          git commit -m "📊 自动更新彩票数据 $(date +'%Y-%m-%d')"
          git push
