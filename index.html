<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>彩票助手 - 双色球 & 大乐透 & 快乐8</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:#0a0e17;color:#e0e6ed;min-height:100vh;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;padding:12px;padding-bottom:80px}
h1{text-align:center;font-size:20px;padding:14px 0 4px;background:linear-gradient(135deg,#f5af19,#f12711);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;font-size:11px;color:#3a4a5a;margin-bottom:12px}
.lottery-switch{display:flex;gap:6px;margin-bottom:12px}
.lottery-switch button{flex:1;padding:8px 4px;border:2px solid #1e2a3a;border-radius:10px;background:#111825;color:#8899aa;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.lottery-switch button.active-ssq{border-color:#e74c3c;color:#e74c3c;background:#1a0a0a;box-shadow:0 0 15px rgba(231,76,60,.12)}
.lottery-switch button.active-dlt{border-color:#3498db;color:#3498db;background:#0a0a1a;box-shadow:0 0 15px rgba(52,152,219,.12)}
.lottery-switch button.active-kl8{border-color:#2ecc71;color:#2ecc71;background:#0a1a0a;box-shadow:0 0 15px rgba(46,204,113,.12)}
.tabs{display:flex;gap:4px;margin-bottom:12px;background:#111825;border-radius:10px;padding:4px}
.tab-btn{flex:1;padding:8px 4px;border:none;border-radius:8px;background:transparent;color:#5a6a80;font-size:13px;cursor:pointer;transition:all .2s}
.tab-btn.active{background:#1e2a3a;color:#fff;font-weight:600}
.panel{display:none}.panel.active{display:block}
.ball{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:13px;font-weight:700;margin:1.5px}
.ball-red{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}
.ball-blue{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff}
.ball-green{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff}
.ball-gray{background:#1e2a3a;color:#5a6a80}
.ball-sm{width:24px;height:24px;font-size:11px;margin:1px}
.ball-xs{width:22px;height:22px;font-size:10px;margin:1px}
.draw-card{background:#111825;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #1e2a3a}
.draw-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.draw-period{font-size:15px;font-weight:700;color:#f5af19}
.draw-date{font-size:12px;color:#5a6a80}
.draw-balls{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin-bottom:8px}
.draw-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;color:#8899aa}
.draw-info span{color:#f5af19;font-weight:600}
.divider{width:1px;height:18px;background:#1e2a3a;margin:0 3px}
.input-section{background:#111825;border-radius:12px;padding:14px;margin-bottom:12px}
.input-section h3{font-size:14px;margin-bottom:8px;color:#8899aa}
.ball-input-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;align-items:center}
.ball-input{width:40px;height:36px;border-radius:8px;border:2px solid #1e2a3a;background:#0a0e17;color:#fff;text-align:center;font-size:14px;font-weight:600}
.ball-input:focus{border-color:#f5af19;outline:none}
.ball-input.red-focus:focus{border-color:#e74c3c}
.ball-input.blue-focus:focus{border-color:#3498db}
.ball-input.green-focus:focus{border-color:#2ecc71}
.seperator{color:#5a6a80;font-size:16px;font-weight:700;margin:0 2px}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;width:100%}
.btn-primary{background:linear-gradient(135deg,#f5af19,#f12711);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:#1e2a3a;color:#8899aa}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-row .btn{flex:1}
.result-title{font-size:14px;color:#8899aa;margin:12px 0 8px}
.match-card{background:#111825;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #1e2a3a}
.match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.match-period{font-size:13px;font-weight:600;color:#f5af19}
.match-level{font-size:12px;padding:2px 8px;border-radius:4px;font-weight:600}
.level-1{background:#f12711;color:#fff}.level-2{background:#e67e22;color:#fff}
.level-3{background:#f39c12;color:#fff}.level-4{background:#27ae60;color:#fff}
.level-5{background:#3498db;color:#fff}.level-6{background:#1e2a3a;color:#8899aa}
.level-0{background:#111;color:#3a4a5a}
.match-balls{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:4px}
.match-info{font-size:11px;color:#5a6a80}
.rec-card{background:#111825;border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid #1e2a3a}
.rec-header{font-size:12px;color:#5a6a80;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.rec-balls{display:flex;flex-wrap:wrap;gap:2px}
.loading{text-align:center;padding:40px;color:#5a6a80}
.empty{text-align:center;padding:30px;color:#3a4a5a;font-size:13px}
.stats-bar{background:#111825;border-radius:10px;padding:12px;margin-bottom:12px;display:flex;justify-content:space-around;text-align:center}
.stats-item .num{font-size:18px;font-weight:700;color:#f5af19}
.stats-item .label{font-size:11px;color:#5a6a80;margin-top:2px}
.copy-btn{background:none;border:1px solid #1e2a3a;color:#5a6a80;padding:2px 8px;border-radius:4px;font-size:11px;cursor:pointer}
.copy-btn:hover{border-color:#f5af19;color:#f5af19}
.kl8-num-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-bottom:8px}
.kl8-num{display:flex;align-items:center;justify-content:center;height:26px;border-radius:4px;font-size:11px;font-weight:600}
.kl8-num.hit{background:linear-gradient(135deg,#2ecc71,#27ae60);color:#fff}
.kl8-num.miss{background:#1e2a3a;color:#3a4a5a}
@media(max-width:360px){.ball{width:26px;height:26px;font-size:11px}.ball-sm{width:20px;height:20px;font-size:9px}.ball-xs{width:18px;height:18px;font-size:9px}.ball-input{width:34px;height:32px;font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <h1>🎰 彩票助手</h1>
  <div class="subtitle" id="update-time"></div>

  <div class="lottery-switch">
    <button id="btn-ssq" class="active-ssq" onclick="switchLottery('ssq')">🔴 双色球</button>
    <button id="btn-dlt" onclick="switchLottery('dlt')">🔵 大乐透</button>
    <button id="btn-kl8" onclick="switchLottery('kl8')">🟢 快乐8</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(0)">📊 开奖结果</button>
    <button class="tab-btn" onclick="switchTab(1)">🔍 号码查询</button>
    <button class="tab-btn" onclick="switchTab(2)">🎯 号码推荐</button>
  </div>

  <div id="panel0" class="panel active">
    <div id="stats-bar" class="stats-bar"></div>
    <div id="draw-list"></div>
  </div>
  <div id="panel1" class="panel">
    <div class="input-section" id="query-input"></div>
    <div id="query-result"></div>
  </div>
  <div id="panel2" class="panel">
    <div class="input-section" id="rec-filter"></div>
    <div style="text-align:center;margin-bottom:12px;">
      <button class="btn btn-primary" onclick="generateRecommendation()" style="max-width:280px;margin:auto;">🎯 生成20组推荐号码</button>
    </div>
    <div id="rec-list"></div>
  </div>
</div>

<script>
let ssqData=[],dltData=[],kl8Data=[];
let currentLottery='ssq';
const DATA_BASE='./data';

async function loadData(){
  document.getElementById('draw-list').innerHTML='<div class="loading">⏳ 加载数据中...</div>';
  try{
    const [ssqResp,dltResp,kl8Resp]=await Promise.all([
      fetch(DATA_BASE+'/ssq.csv'),fetch(DATA_BASE+'/dlt.csv'),fetch(DATA_BASE+'/kl8.csv')
    ]);
    const ssqText=await ssqResp.text();
    const dltText=await dltResp.text();
    const kl8Text=await kl8Resp.text();
    ssqData=parseSSQ(ssqText);
    dltData=parseDLT(dltText);
    kl8Data=parseKL8(kl8Text);
    document.getElementById('update-time').textContent='双色球 & 大乐透 & 快乐8 | '+ssqData[0]?.date+' / '+dltData[0]?.date+' / '+kl8Data[0]?.date;
    renderDrawList();
  }catch(e){
    document.getElementById('draw-list').innerHTML='<div class="empty">❌ 数据加载失败<br><small>'+e.message+'</small></div>';
  }
}

function parseSSQ(text){
  const lines=text.trim().split('\n');const data=[];
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(',');if(c.length<9)continue;
    data.push({period:c[0].trim(),date:c[1].trim(),type:'ssq',
      reds:[+c[2],+c[3],+c[4],+c[5],+c[6],+c[7]],blue:+c[8],
      sales:c[9]||'0',p1count:c[10]||'0',p1amount:c[11]||'0',p2count:c[12]||'0',p2amount:c[13]||'0',pool:c[14]||'0'});
  }
  data.sort((a,b)=>b.period.localeCompare(a.period));return data;
}
function parseDLT(text){
  const lines=text.trim().split('\n');const data=[];
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(',');if(c.length<9)continue;
    data.push({period:c[0].trim(),date:c[1].trim(),type:'dlt',
      reds:[+c[2],+c[3],+c[4],+c[5],+c[6]],blues:[+c[7],+c[8]],
      sales:c[9]||'0',p1count:c[10]||'0',p1amount:c[11]||'0',p2count:c[12]||'0',p2amount:c[13]||'0',pool:c[14]||'0'});
  }
  data.sort((a,b)=>b.period.localeCompare(a.period));return data;
}
function parseKL8(text){
  const lines=text.trim().split('\n');const data=[];
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(',');if(c.length<22)continue;
    data.push({period:c[0].trim(),date:c[1].trim(),type:'kl8',
      nums:c.slice(2,22).map(x=>+x)});
  }
  data.sort((a,b)=>b.period.localeCompare(a.period));return data;
}

function switchLottery(type){
  currentLottery=type;
  document.getElementById('btn-ssq').className=type==='ssq'?'active-ssq':'';
  document.getElementById('btn-dlt').className=type==='dlt'?'active-dlt':'';
  document.getElementById('btn-kl8').className=type==='kl8'?'active-kl8':'';
  renderDrawList();renderQueryInput();renderRecFilter();
  document.getElementById('query-result').innerHTML='';
  document.getElementById('rec-list').innerHTML='';
}
function switchTab(idx){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.className=i===idx?'tab-btn active':'tab-btn');
  document.querySelectorAll('.panel').forEach((p,i)=>p.className=i===idx?'panel active':'panel');
  if(idx===1)renderQueryInput();
  if(idx===2)renderRecFilter();
}
function getData(){return currentLottery==='ssq'?ssqData:currentLottery==='dlt'?dltData:kl8Data}

// ===== 功能1：开奖结果 =====
function renderDrawList(){
  const data=getData();if(!data.length)return;
  const isSSQ=currentLottery==='ssq',isDLT=currentLottery==='dlt',isKL8=currentLottery==='kl8';
  document.getElementById('stats-bar').innerHTML=`
    <div class="stats-item"><div class="num">${data.length}</div><div class="label">总期数</div></div>
    <div class="stats-item"><div class="num">${data[0].period}</div><div class="label">最新期</div></div>
    <div class="stats-item"><div class="num">${data[data.length-1].period}</div><div class="label">起始期</div></div>`;
  let html='';
  for(const d of data.slice(0,20)){
    if(isKL8){
      const numSet=new Set(d.nums);
      let numGrid='<div class="kl8-num-grid">';
      for(let n=1;n<=80;n++)numGrid+=`<div class="kl8-num ${numSet.has(n)?'hit':'miss'}">${p2(n)}</div>`;
      numGrid+='</div>';
      html+=`<div class="draw-card">
        <div class="draw-header"><span class="draw-period">第${d.period}期</span><span class="draw-date">${d.date}</span></div>
        <div class="draw-balls">${d.nums.map(n=>`<span class="ball ball-xs ball-green">${p2(n)}</span>`).join('')}</div>
        ${numGrid}</div>`;
    }else{
      const redBalls=d.reds.map(r=>`<span class="ball ball-sm ball-red">${p2(r)}</span>`).join('');
      const blueBalls=isSSQ
        ?`<span class="divider"></span><span class="ball ball-sm ball-blue">${p2(d.blue)}</span>`
        :`<span class="divider"></span><span class="ball ball-sm ball-blue">${p2(d.blues[0])}</span><span class="ball ball-sm ball-blue">${p2(d.blues[1])}</span>`;
      html+=`<div class="draw-card">
        <div class="draw-header"><span class="draw-period">第${d.period}期</span><span class="draw-date">${d.date}</span></div>
        <div class="draw-balls">${redBalls}${blueBalls}</div>
        <div class="draw-info">
          <div>一等奖: <span>${d.p1count}</span>注 <span>${formatMoney(d.p1amount)}</span>元</div>
          <div>二等奖: <span>${d.p2count}</span>注 <span>${formatMoney(d.p2amount)}</span>元</div>
          <div>销售额: <span>${formatMoney(d.sales)}</span>元</div>
          <div>奖池: <span>${formatMoney(d.pool)}</span>元</div>
        </div></div>`;
    }
  }
  document.getElementById('draw-list').innerHTML=html;
}

// ===== 功能2：号码查询 =====
function renderQueryInput(){
  const isSSQ=currentLottery==='ssq',isDLT=currentLottery==='dlt',isKL8=currentLottery==='kl8';
  let html='<h3>输入你的号码</h3><div class="ball-input-row">';
  
  if(isKL8){
    html+='<p style="font-size:12px;color:#5a6a80;margin-bottom:6px">快乐8：输入1-10个号码（1-80），查历史命中情况</p>';
    for(let i=0;i<10;i++)html+=`<input class="ball-input green-focus" id="qn${i}" type="number" min="1" max="80" placeholder="1-80" oninput="autoFocusKL8(this,${i})">`;
  }else{
    const redCount=isSSQ?6:5;
    for(let i=0;i<redCount;i++)html+=`<input class="ball-input red-focus" id="qr${i}" type="number" min="1" max="${isSSQ?33:35}" placeholder="${isSSQ?'1-33':'1-35'}" oninput="autoFocus(this,${i},'red')">`;
    if(isSSQ)html+=`<span class="seperator">+</span><input class="ball-input blue-focus" id="qb0" type="number" min="1" max="16" placeholder="1-16">`;
    else html+=`<span class="seperator">+</span><input class="ball-input blue-focus" id="qb0" type="number" min="1" max="12" placeholder="1-12"><input class="ball-input blue-focus" id="qb1" type="number" min="1" max="12" placeholder="1-12">`;
  }
  html+='</div><div class="btn-row"><button class="btn btn-primary" onclick="queryNumber()">🔍 查询</button><button class="btn btn-secondary" onclick="clearQuery()">清空</button></div>';
  document.getElementById('query-input').innerHTML=html;
}

function autoFocus(el,idx,type){
  if(el.value.length>=2){
    const isSSQ=currentLottery==='ssq',redCount=isSSQ?6:5;
    if(type==='red'&&idx<redCount-1)document.getElementById('qr'+(idx+1)).focus();
    else if(type==='red'&&idx===redCount-1)document.getElementById('qb0').focus();
  }
}
function autoFocusKL8(el,idx){
  if(el.value.length>=2&&idx<9)document.getElementById('qn'+(idx+1)).focus();
}

function queryNumber(){
  const data=getData(),isSSQ=currentLottery==='ssq',isDLT=currentLottery==='dlt',isKL8=currentLottery==='kl8';
  
  if(isKL8){queryKL8(data);return}
  
  const redCount=isSSQ?6:5;
  const inputReds=[];
  for(let i=0;i<redCount;i++){
    const v=parseInt(document.getElementById('qr'+i).value);
    if(!v||v<1||v>(isSSQ?33:35)){alert(`红球${i+1}请输入1-${isSSQ?33:35}`);return}
    if(inputReds.includes(v)){alert('红球不能重复');return}
    inputReds.push(v);
  }
  const inputBlues=[];
  if(isSSQ){const v=parseInt(document.getElementById('qb0').value);if(!v||v<1||v>16){alert('蓝球1-16');return}inputBlues.push(v)}
  else{for(let i=0;i<2;i++){const v=parseInt(document.getElementById('qb'+i).value);if(!v||v<1||v>12){alert(`后区${i+1}: 1-12`);return}inputBlues.push(v)}}
  inputReds.sort((a,b)=>a-b);inputBlues.sort((a,b)=>a-b);
  
  const results=[];
  for(const d of data){
    const redMatch=d.reds.filter(r=>inputReds.includes(r)).length;
    const blueMatch=isSSQ?(d.blue===inputBlues[0]?1:0):d.blues.filter(b=>inputBlues.includes(b)).length;
    const level=isSSQ?getSSQLevel(redMatch,blueMatch):getDLTLevel(redMatch,blueMatch);
    if(level>0||redMatch>=3||(redMatch>=2&&blueMatch>=1))results.push({...d,redMatch,blueMatch,level});
  }
  results.sort((a,b)=>b.level-a.level||b.period.localeCompare(a.period));
  const box=document.getElementById('query-result');
  if(!results.length){box.innerHTML='<div class="empty">该组号码历史上从未中奖 🎲</div>';return}
  
  const levelCounts={},levelAmounts={};
  const ssqFixed={3:3000,4:200,5:10,6:5};
  const dltFixed={3:10000,4:3000,5:300,6:200,7:100,8:15,9:5};
  for(const r of results){
    levelCounts[r.level]=(levelCounts[r.level]||0)+1;
    if(!levelAmounts[r.level])levelAmounts[r.level]=0;
    if(r.level===1)levelAmounts[r.level]+=parseInt(String(r.p1amount).replace(/,/g,''))||0;
    else if(r.level===2)levelAmounts[r.level]+=parseInt(String(r.p2amount).replace(/,/g,''))||0;
    else levelAmounts[r.level]+=(isSSQ?ssqFixed[r.level]:dltFixed[r.level])||0;
  }
  const levelNames=isSSQ?{6:'六等奖',5:'五等奖',4:'四等奖',3:'三等奖',2:'二等奖',1:'一等奖'}:{9:'九等奖',8:'八等奖',7:'七等奖',6:'六等奖',5:'五等奖',4:'四等奖',3:'三等奖',2:'二等奖',1:'一等奖'};
  let statsHtml='<div class="result-title">📊 中奖统计</div><div class="stats-bar" style="flex-wrap:wrap;gap:8px">';
  for(const[lv,cnt]of Object.entries(levelCounts).sort((a,b)=>b[0]-a[0])){
    const amt=levelAmounts[lv]||0;
    statsHtml+=`<div class="stats-item" style="min-width:80px"><div class="num">${cnt}次</div><div class="label">${levelNames[lv]||lv+'等奖'}</div><div style="font-size:10px;color:#e67e22;margin-top:2px">${formatMoney(''+amt)}元</div></div>`;
  }
  statsHtml+='</div>';
  
  let listHtml=`<div class="result-title">📋 历史中奖记录（共${results.length}次）</div>`;
  for(const r of results.slice(0,50)){
    const redBalls=r.reds.map(red=>`<span class="ball ball-sm ${inputReds.includes(red)?'ball-red':'ball-gray'}">${p2(red)}</span>`).join('');
    const blueBalls=isSSQ
      ?`<span class="divider"></span><span class="ball ball-sm ${r.blueMatch?'ball-blue':'ball-gray'}">${p2(r.blue)}</span>`
      :`<span class="divider"></span>${r.blues.map(b=>`<span class="ball ball-sm ${inputBlues.includes(b)?'ball-blue':'ball-gray'}">${p2(b)}</span>`).join('')}`;
    const levelClass=r.level<=1?'level-1':r.level<=2?'level-2':r.level<=3?'level-3':r.level<=4?'level-4':r.level<=5?'level-5':'level-6';
    listHtml+=`<div class="match-card"><div class="match-header"><span class="match-period">第${r.period}期 ${r.date}</span><span class="match-level ${levelClass}">${levelNames[r.level]||'未中奖'}</span></div><div class="match-balls">${redBalls}${blueBalls}</div><div class="match-info">命中: 红${r.redMatch}/${redCount} ${isSSQ?'蓝':'后区'}${r.blueMatch}/${isSSQ?1:2}</div></div>`;
  }
  box.innerHTML=statsHtml+listHtml;
}

function queryKL8(data){
  const inputNums=[];
  for(let i=0;i<10;i++){
    const v=parseInt(document.getElementById('qn'+i).value);
    if(isNaN(v)||v===0)continue;
    if(v<1||v>80){alert('号码1-80');return}
    if(inputNums.includes(v)){alert('号码不能重复');return}
    inputNums.push(v);
  }
  if(!inputNums.length){alert('请至少输入1个号码');return}
  inputNums.sort((a,b)=>a-b);
  
  const results=[];
  for(const d of data){
    const hitCount=d.nums.filter(n=>inputNums.includes(n)).length;
    if(hitCount>0)results.push({...d,hitCount,missCount:inputNums.length-hitCount});
  }
  results.sort((a,b)=>b.hitCount-a.hitCount||b.period.localeCompare(a.period));
  
  const box=document.getElementById('query-result');
  if(!results.length){box.innerHTML='<div class="empty">这些号码历史上从未同时命中 🎲</div>';return}
  
  const hitDist={};for(const r of results)hitDist[r.hitCount]=(hitDist[r.hitCount]||0)+1;
  let statsHtml='<div class="result-title">📊 命中统计（你选了'+inputNums.length+'个号码）</div><div class="stats-bar">';
  for(const[hit,cnt]of Object.entries(hitDist).sort((a,b)=>b[0]-a[0]))
    statsHtml+=`<div class="stats-item"><div class="num">${cnt}</div><div class="label">命中${hit}个</div></div>`;
  statsHtml+='</div>';
  
  let listHtml=`<div class="result-title">📋 最近命中记录（共${results.length}次）</div>`;
  for(const r of results.slice(0,50)){
    listHtml+=`<div class="match-card">
      <div class="match-header"><span class="match-period">第${r.period}期 ${r.date}</span><span class="match-level level-4">命中${r.hitCount}/${inputNums.length}</span></div>
      <div class="draw-balls">${r.nums.map(n=>`<span class="ball ball-xs ${inputNums.includes(n)?'ball-green':'ball-gray'}">${p2(n)}</span>`).join('')}</div></div>`;
  }
  box.innerHTML=statsHtml+listHtml;
}

function clearQuery(){
  const isKL8=currentLottery==='kl8';
  if(isKL8){for(let i=0;i<10;i++)document.getElementById('qn'+i).value='';}
  else{
    const isSSQ=currentLottery==='ssq',redCount=isSSQ?6:5;
    for(let i=0;i<redCount;i++)document.getElementById('qr'+i).value='';
    if(isSSQ)document.getElementById('qb0').value='';
    else{document.getElementById('qb0').value='';document.getElementById('qb1').value=''}
  }
  document.getElementById('query-result').innerHTML='';
}

function getSSQLevel(r,b){if(r===6&&b===1)return 1;if(r===6)return 2;if(r===5&&b===1)return 3;if(r===5||r===4&&b===1)return 4;if(r===4||r===3&&b===1)return 5;if(b===1)return 6;return 0}
function getDLTLevel(r,b){if(r===5&&b===2)return 1;if(r===5&&b===1)return 2;if(r===5)return 3;if(r===4&&b===2)return 4;if(r===4&&b===1)return 5;if(r===3&&b===2)return 6;if(r===4||r===3&&b===1||r===2&&b===2)return 7;if(r===3||r===2&&b===1||r===1&&b===2||b===2)return 8;if(r===2||r===1&&b===1||b===1)return 9;return 0}

  const el=document.getElementById('rec-filter');
  if(isKL8){
    let html='<h3>🎯 一等奖重合筛选</h3><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
    html+='<span style="font-size:12px;color:#8899aa">重合个数:</span>';
    html+='<select id="rec-kl8-hit" style="background:#0a0e17;color:#e0e6ed;border:2px solid #1e2a3a;border-radius:8px;padding:6px 10px;font-size:13px"><option value="-1">不限</option>';
    for(let i=0;i<=10;i++)html+=`<option value="${i}">${i}个</option>`;
    html+='</select></div>';
    el.innerHTML=html;
  }else{
    const redCount=isSSQ?6:5;
    let html='<h3>🎯 一等奖重合筛选</h3><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">';
    html+='<span style="font-size:12px;color:#8899aa">红球重合:</span>';
    html+='<select id="rec-red-hit" style="background:#0a0e17;color:#e0e6ed;border:2px solid #1e2a3a;border-radius:8px;padding:6px 10px;font-size:13px"><option value="-1">不限</option>';
    for(let i=0;i<=redCount;i++)html+=`<option value="${i}">${i}个</option>`;
    html+='</select>';
    html+='<span style="font-size:12px;color:#8899aa;margin-left:6px">蓝球重合:</span>';
    const blueCount=isSSQ?1:2;
    html+='<select id="rec-blue-hit" style="background:#0a0e17;color:#e0e6ed;border:2px solid #1e2a3a;border-radius:8px;padding:6px 10px;font-size:13px"><option value="-1">不限</option>';
    for(let i=0;i<=blueCount;i++)html+=`<option value="${i}">${i}个</option>`;
    html+='</select></div>';

function generateRecommendation(){
  const data=getData(),isSSQ=currentLottery==='ssq',isDLT=currentLottery==='dlt',isKL8=currentLottery==='kl8';
  renderRecFilter();
  
  if(isKL8){generateKL8Rec(data);return}
  
  const filterRedEl=document.getElementById('rec-red-hit');
  const filterBlueEl=document.getElementById('rec-blue-hit');
  const filterRed=filterRedEl?parseInt(filterRedEl.value):-1;
  const filterBlue=filterBlueEl?parseInt(filterBlueEl.value):-1;
  
  const redMax=isSSQ?33:35,blueMax=isSSQ?16:12,redCount=isSSQ?6:5,blueCount=isSSQ?1:2;
  const histP1=new Set(),histP2=new Set();
  for(const d of data){
    const rk=d.reds.slice().sort((a,b)=>a-b).join(',');
    if(isSSQ){histP1.add(rk+'|'+d.blue);histP2.add(rk)}
    else{const bk=d.blues.slice().sort((a,b)=>a-b).join(',');histP1.add(rk+'|'+bk);histP2.add(rk+'|'+d.blues[0]);histP2.add(rk+'|'+d.blues[1])}
  }
  const redFreq={},blueFreq={};
  for(let i=1;i<=redMax;i++)redFreq[i]=0;for(let i=1;i<=blueMax;i++)blueFreq[i]=0;
  for(const d of data){for(const r of d.reds)redFreq[r]++;if(isSSQ)blueFreq[d.blue]++;else for(const b of d.blues)blueFreq[b]++}
  const totalR=Object.values(redFreq).reduce((a,b)=>a+b,0),totalB=Object.values(blueFreq).reduce((a,b)=>a+b,0);
  const rw={},bw={};
  for(let i=1;i<=redMax;i++)rw[i]=(totalR/redMax)/Math.max(redFreq[i],1);
  for(let i=1;i<=blueMax;i++)bw[i]=(totalB/blueMax)/Math.max(blueFreq[i],1);
  function wr(w,m){const e=[];for(let i=1;i<=m;i++)e.push([i,w[i]]);const s=e.reduce((a,x)=>a+x[1],0);let r=Math.random()*s;for(const[v,w2]of e){r-=w2;if(r<=0)return v}return m}
  function gen1(){const r=new Set();while(r.size<redCount)r.add(wr(rw,redMax));const b=new Set();while(b.size<blueCount)b.add(wr(bw,blueMax));return{reds:[...r].sort((a,b)=>a-b),blues:[...b].sort((a,b)=>a-b)}}
  const histP1Draws=data.filter(d=>parseInt(String(d.p1count).replace(/,/g,''))>0);
  function matchFilter(c){
    if(filterRed===-1&&filterBlue===-1)return true;
    for(const d of histP1Draws){
      const matchRed=c.reds.filter(v=>d.reds.includes(v)).length;
      const matchBlue=isSSQ?(c.blues[0]===d.blue?1:0):c.blues.filter(b=>d.blues.includes(b)).length;
      const redOk=filterRed===-1||matchRed===filterRed;
      const blueOk=filterBlue===-1||matchBlue===filterBlue;
      if(redOk&&blueOk)return true;
    }
    return false;
  }
  const recs=[],seen=new Set();let att=0;
  while(recs.length<20&&att<5000){att++;const c=gen1();const fk=c.reds.join(',')+'|'+c.blues.join(',');
    if(histP1.has(fk))continue;if(isSSQ&&histP2.has(c.reds.join(',')))continue;
    if(!isSSQ&&(histP2.has(c.reds.join(',')+'|'+c.blues[0])||histP2.has(c.reds.join(',')+'|'+c.blues[1])))continue;
    if(seen.has(fk))continue;
    if(!matchFilter(c))continue;
    seen.add(fk);recs.push(c)}
  
  const box=document.getElementById('rec-list');
  let filterDesc='';
  if(filterRed!==-1||filterBlue!==-1)filterDesc=`（筛选: 红${filterRed===-1?'不限':filterRed+'个'}+${isSSQ?'蓝':'后区'}${filterBlue===-1?'不限':filterBlue+'个'}重合）`;
  let html=`<div class="result-title">🎯 冷门加权推荐（${recs.length}组，排除历史一二等奖号码）${filterDesc}</div>`;
  if(!recs.length){html+='<div class="empty">筛选条件太严格，未找到符合的推荐号码，试试放宽条件</div>';box.innerHTML=html;return}
  for(let i=0;i<recs.length;i++){
    const r=recs[i];
    let maxP1Hit=0,bestP1Draw=null,bestP1MatchReds=[],bestP1MatchBlue=false;
    for(const d of histP1Draws){
      const matchReds=r.reds.filter(v=>d.reds.includes(v));
      const matchBlue=isSSQ?(r.blues[0]===d.blue):r.blues.some(b=>d.blues.includes(b));
      const totalHit=matchReds.length+(matchBlue?1:0);
      if(totalHit>maxP1Hit){maxP1Hit=totalHit;bestP1Draw=d;bestP1MatchReds=matchReds;bestP1MatchBlue=matchBlue}
    }
    
    const rb=r.reds.map(v=>{
      const isP1Hit=bestP1MatchReds.includes(v);
      return`<span class="ball ${isP1Hit?'ball-red':'ball-gray'}">${p2(v)}</span>`;
    }).join('');
    const bb=isSSQ
      ?`<span class="seperator">+</span><span class="ball ${bestP1MatchBlue?'ball-blue':'ball-gray'}">${p2(r.blues[0])}</span>`
      :`<span class="seperator">+</span>${r.blues.map(b=>`<span class="ball ${bestP1MatchBlue&&bestP1Draw&&bestP1Draw.blues.includes(b)?'ball-blue':'ball-gray'}">${p2(b)}</span>`).join('')}`;
    const numStr=isSSQ?r.reds.map(p2).join(' ')+(' +'+p2(r.blues[0])):r.reds.map(p2).join(' ')+(' +'+r.blues.map(p2).join(' '));
    
    let p1Info='';
    if(bestP1Draw){
      const matchRedStr=bestP1MatchReds.map(p2).join(',');
      p1Info=`<div style="margin-top:6px;font-size:11px;color:#e67e22">与一等奖最高重合: <b>${maxP1Hit}</b>个 (第${bestP1Draw.period}期) 红${matchRedStr}${bestP1MatchBlue?'+蓝✓':''}</div>`;
    }else{
      p1Info='<div style="margin-top:6px;font-size:11px;color:#5a6a80">与一等奖无重合</div>';
    }
    
    html+=`<div class="rec-card"><div class="rec-header">推荐 #${i+1}<button class="copy-btn" onclick="copyNum('${numStr}')">复制</button></div><div class="rec-balls">${rb}${bb}</div>${p1Info}</div>`;
  }
  box.innerHTML=html;
}

function generateKL8Rec(data){
  const histFull=new Set();
  for(const d of data){
    const key=d.nums.sort((a,b)=>a-b).join(',');
    histFull.add(key);
  }
  const freq={};for(let i=1;i<=80;i++)freq[i]=0;
  for(const d of data)for(const n of d.nums)freq[n]++;
  const total=data.length*20;
  const weights={};for(let i=1;i<=80;i++)weights[i]=(total/80)/Math.max(freq[i],1);
  
  function wr(w,m){const e=[];for(let i=1;i<=m;i++)e.push([i,w[i]]);const s=e.reduce((a,x)=>a+x[1],0);let r=Math.random()*s;for(const[v,w2]of e){r-=w2;if(r<=0)return v}return m}
  function gen1(){const r=new Set();while(r.size<10)r.add(wr(weights,80));return[...r].sort((a,b)=>a-b)}
  
  const filterKL8El=document.getElementById('rec-kl8-hit');
  const filterKL8=filterKL8El?parseInt(filterKL8El.value):-1;
  function matchKL8Filter(c){
    if(filterKL8===-1)return true;
    for(const d of data){
      const hitCount=c.filter(n=>d.nums.includes(n)).length;
      if(hitCount===filterKL8)return true;
    }
    return false;
  }
  
  const recs=[],seen=new Set();let att=0;
  while(recs.length<20&&att<5000){att++;const c=gen1();const fk=c.join(',');
    let allHit=false;
    for(const d of data){
      if(c.every(n=>d.nums.includes(n))){allHit=true;break}
    }
    if(allHit)continue;if(seen.has(fk))continue;
    if(!matchKL8Filter(c))continue;
    seen.add(fk);recs.push(c)}
  
  const histP1Draws=data;
  const box=document.getElementById('rec-list');
  let filterDesc=filterKL8!==-1?`（筛选: 重合${filterKL8}个）`:'';
  let html=`<div class="result-title">🎯 快乐8选十推荐（${recs.length}组，排除历史选十全中号码）${filterDesc}</div>`;
  if(!recs.length){html+='<div class="empty">筛选条件太严格，未找到符合的推荐号码，试试放宽条件</div>';box.innerHTML=html;return}
  for(let i=0;i<recs.length;i++){
    const r=recs[i];
    let maxHit=0,bestDraw=null,bestHitNums=[];
    for(const d of histP1Draws){
      const hitNums=r.filter(n=>d.nums.includes(n));
      if(hitNums.length>maxHit){maxHit=hitNums.length;bestDraw=d;bestHitNums=hitNums}
    }
    
    const balls=r.map(v=>{
      const isHit=bestHitNums.includes(v);
      return`<span class="ball ball-xs ${isHit?'ball-green':'ball-gray'}">${p2(v)}</span>`;
    }).join('');
    const numStr=r.map(p2).join(' ');
    
    let hitInfo='';
    if(bestDraw&&maxHit>0){
      const hitStr=bestHitNums.map(p2).join(',');
      hitInfo=`<div style="margin-top:6px;font-size:11px;color:#e67e22">与开奖最高重合: <b>${maxHit}/10</b> (第${bestDraw.period}期) ${hitStr}</div>`;
    }else{
      hitInfo='<div style="margin-top:6px;font-size:11px;color:#5a6a80">与历史开奖无重合</div>';
    }
    
    html+=`<div class="rec-card"><div class="rec-header">推荐 #${i+1}<button class="copy-btn" onclick="copyNum('${numStr}')">复制</button></div><div class="rec-balls">${balls}</div>${hitInfo}</div>`;
  }
  box.innerHTML=html;
}

function copyNum(s){navigator.clipboard.writeText(s).then(()=>{const btn=event.target;btn.textContent='已复制';setTimeout(()=>btn.textContent='复制',1500)}).catch(()=>{})}

function p2(n){return n<10?'0'+n:''+n}
function formatMoney(s){const n=parseInt(String(s).replace(/,/g,''));if(isNaN(n))return s;if(n>=1e8)return(n/1e8).toFixed(2)+'亿';if(n>=1e4)return(n/1e4).toFixed(0)+'万';return n.toLocaleString()}
